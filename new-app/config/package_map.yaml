# Where automation runs on a real MOA Valuation Package.
# Derived from TEST23.docx plus photos of plan 800643 (Deerfield 403(b), PYE 06/30/2026).
# Source files live in: K:\Mutual of America\<PlanNumber>\Testing\<YYYY Testing>\Valuation Package
# All files in that folder must be PDF. The app reads that folder or accepts uploads.

plan_example:
  plan_number: "800643"
  company_name: DEERFIELD BEHAVIORAL HEALTH OF WARREN
  plan_name: DEERFIELD BEHAVIORAL HEALTH OF WARREN LLC 403(B) PLAN
  plan_type: 403b
  plan_year_start: 07/01/2025
  plan_year_end: 06/30/2026
  beginning_plan_year: "2025"
  output_name: 800643_2025-Valuation.pdf

# Combine order (TEST23 §6). Optional files are skipped when missing.
file_types:
  - name: Cover Letter
    how_to_recognize: ["Mutual of America", "RE:", "period ending", "Action Required section"]
    automation:
      - validate MOA stamp / Mutual of America is the only entity
      - extract company, address, plan name, plan year end, plan number
      - letterhead date should be single digit day (1 not 01)
      - never remove this file

  - name: Test Summary
    how_to_recognize: ["Test Summary", "Annual Valuation Report"]
    automation:
      - extract testing method CURRENT vs PRIOR
      - extract top heavy percent, pass/fail flags, QNEC and refund amounts
      - not in the photos; still required in a full package

  - name: Action Required
    how_to_recognize: ["ACTION REQUIRED", "IMMEDIATE ACTION REQUIRED", "NO IMMEDIATE ACTION"]
    automation: paragraph_keep_remove
    blocks:
      - heading: IMMEDIATE ACTION REQUIRED - COMPLIANCE TEST FAILURE
        keep_when: non-ADP/ACP failure that causes returns (402g/415)
      - heading: IMMEDIATE ACTION REQUIRED - ACP TEST FAILURE
        keep_when: ACP failed and returns required (PRIOR wording has no QNEC sentence; CURRENT wording has QNEC)
      - heading: IMMEDIATE ACTION REQUIRED - CONTRIBUTIONS
        keep_when: contribution/census adjustment is required
      - heading: IMMEDIATE ACTION REQUIRED - ACP PRIOR METHOD TEST FAILURE - AFTER 12-MONTHS
        keep_when: ACP failed, PRIOR method, correction after 12 months
      - heading: IMMEDIATE ACTION REQUIRED - ACP CURRENT METHOD TEST FAILURE - AFTER 12-MONTHS
        keep_when: ACP failed, CURRENT method, correction after 12 months
      - heading: NO IMMEDIATE ACTION IS REQUIRED AT THIS TIME
        keep_when: none of the red action items apply

  - name: Excess Return Notice
    how_to_recognize: ["Excess Return Notice", "Failed Compliance Testing"]
    automation: keep_or_drop_page_and_fill_amounts
    variants:
      - title: Failed Compliance Testing (Current method)
        keep_when: ACP/ADP failed, CURRENT, returns required, not after 12 months
        fill: ["ACP QNEC $X,XXX,XXX.XX"]
      - title: Failed Compliance Testing - After 12-months (Current method)
        keep_when: CURRENT and after 12 months
        fill: ["QNEC $X,XXX,XXX.XX", "Match contribution $X,XXX,XXX.XX"]
      - title: Failed Compliance Testing - After 12-months (Prior method)
        keep_when: PRIOR and after 12 months
        fill: ["Match contribution $X,XXX,XXX.XX"]
        note: PRIOR with returns does NOT get the standard current-method failure notice

  - name: 415 Failure Information
    how_to_recognize: ["Annual Additions (IRC 415) Test Failure Information"]
    automation:
      - remove entire file/pages if plan did not fail 415

  - name: Sample Letter ACP
    how_to_recognize: ["SAMPLE/DRAFT Communication", "Actual Contribution Percentage (ACP)"]
    automation:
      - remove unless ACP failed and returns required (rule J_ACP)

  - name: Sample Letter ADP
    how_to_recognize: ["SAMPLE/DRAFT Communication", "Average Deferral Percentage (ADP)"]
    automation:
      - remove unless ADP failed and returns required (rule J_ADP)

  - name: Sample Letter 402(g)
    how_to_recognize: ["402(g) Deferral Limit"]
    automation:
      - remove if no 402(g) returns
      - also remove if 402(g) not processed before 4/15 (noted on 402g report)

  - name: Sample Letter 415
    how_to_recognize: ["Annual Additions (IRC 415) limit has been exceeded"]
    automation:
      - remove if plan did not fail 415

  - name: Year End Recap
    how_to_recognize: ["YEAR END RECAP", "Important Information"]
    automation:
      - keep/remove individual bullets (no HCE, SH, PRIOR vs CURRENT, catch-up, universal availability)
      - 403(b) example bullet: plan is not subject to ADP/ACP if no HCEs

  - name: Compliance and Administrative Reports
    how_to_recognize: ["COMPLIANCE AND ADMINISTRATIVE REPORTS", "OVERVIEW AND DESCRIPTIONS"]
    automation:
      - include in every package
      - do not remove

  - name: Contribution Analysis
    how_to_recognize: ["CONTRIBUTION ANALYSIS"]
    automation: [keep, bookmark]

  - name: HCE
    how_to_recognize: ["HCE/KEY EMPLOYEE", "HCE"]
    automation:
      - 403(b) bookmark title is HCE not HCE/Key

  - name: Future HCE
    how_to_recognize: ["Future HCE"]
    automation: [keep if present]

  - name: ACP Tests
    how_to_recognize: ["ACP Test", "ADP/ACP", "Correction Method"]
    automation:
      - 403(b) uses ACP Test bookmark (not ADP/ACP Tests)
      - 401(k) uses ADP Test, ACP Test, or ADP/ACP Tests from filenames / report headings
      - QNEC and refund numbers come from the Correction page

  - name: 402(g) Test
    how_to_recognize: ["402(g)"]
    automation:
      - off-calendar plans use calendar-year dates on this report, not PYE
      - app does not rewrite or validate those dates; source PDF is responsible

  - name: 410(b) Test
    how_to_recognize: ["410(b)"]
    automation: [keep if present]

  - name: 401(a)(4) / BRF / 414(s)
    how_to_recognize: ["401(a)(4)", "BENEFITS, RIGHTS AND FEATURE", "414(s)"]
    automation: [keep if present]

  - name: 415 Limit Test
    how_to_recognize: ["415 Limit", "ANNUAL ADDITION LIMITATION"]
    automation: [keep test; drop failure notice if no fail]

  - name: Top Heavy
    how_to_recognize: ["Top Heavy"]
    automation:
      - keep wording if percent >= 60

  - name: Census
    how_to_recognize: ["EMPLOYEE CENSUS", "Census"]
    automation: [keep, bookmark]

placeholders_to_fill:
  - "$X,XXX,XXX.XX"
  - "ADP/ACP test is $X,XXX,XXX.XX"
  - "ADP QNEC is"
  - "ACP QNEC is"
  - "Deferral Contribution of $"
  - "Match Contribution of $"

not_in_photos_but_required_later:
  - Test Summary page with pass/fail grid
  - Actual ACP/ADP test and correction pages (source of QNEC/refund numbers)
  - Excess Summary report
  - Variance report (MOA may have this; no Statement of Contribution)
  - Census / contribution analysis data files
