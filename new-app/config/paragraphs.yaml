# Real Action Required / notice headings from MOA package plan 800643 (Deerfield).
# Used to find keep/remove blocks once source PDFs have selectable text.

action_required_headings:
  - id: A
    heading: IMMEDIATE ACTION REQUIRED - COMPLIANCE TEST FAILURE
    must_include:
      - Contribution refunds to participants are required to correct compliance testing failures
      - Excess Summary
      - Form W-4P
  - id: B
    heading: IMMEDIATE ACTION REQUIRED - ACP TEST FAILURE
    variant: PRIOR
    must_include:
      - Contribution refunds to participants are required to correct ADP/ACP testing failures
      - Excess Summary
      - Form W-4P
  - id: C
    heading: IMMEDIATE ACTION REQUIRED - ADP/ACP TEST FAILURE
    variant: CURRENT
    must_include:
      - Qualified Non-Elective Contribution
      - Excess Summary
      - Form W-4P
  - id: D
    heading: IMMEDIATE ACTION REQUIRED - ACP CURRENT METHOD TEST FAILURE - AFTER 12-MONTHS
  - id: E
    heading: IMMEDIATE ACTION REQUIRED - ACP PRIOR METHOD TEST FAILURE - AFTER 12-MONTHS
  - id: F
    heading: IMMEDIATE ACTION REQUIRED - TOP HEAVY
  - id: F
    heading: ATTENTION REQUIRED - TOP HEAVY DETERMINATION
  - id: G
    heading: NO IMMEDIATE ACTION IS REQUIRED AT THIS TIME
  - id: H
    heading: IMMEDIATE ACTION REQUIRED - VARIANCE
  - id: M
    heading: IMMEDIATE ACTION REQUIRED - CONTRIBUTIONS

notices:
  - id: I
    heading: Failed Compliance Testing
    extra: For current-method testing
    must_include:
      - Excess Return Notice
      - Qualified Non-Elective Contribution
      - ADP/ACP test is
      - Form W-4P
  - id: D
    heading: Failed Compliance Testing - After 12-months
    extra: Current method testing
  - id: E
    heading: Failed Compliance Testing - After 12-months
    extra: Prior method testing
  - id: L
    heading: Annual Additions (IRC 415) Test Failure Information

sample_letters:
  - id: J_ACP
    heading: SAMPLE/DRAFT Communication to Participant
    extra: Actual Contribution Percentage (ACP)
  - id: J_ADP
    heading: SAMPLE/DRAFT Communication to Participant
    extra: Average Deferral Percentage (ADP)
  - id: K
    heading: 402(g) Deferral Limit
    extra: SAMPLE/DRAFT
  - id: L
    heading: Annual Additions (IRC 415) limit has been exceeded

excess_summary:
  - id: ES
    heading: Excess Summary Report

recap_bullets:
  - id: Y1
    match: did not have any Highly Compensated Employees
  - id: Y2
    match: prior year data
  - id: Y3
    match: the actual amount the employee can defer
  - id: Y4
    match: Safe Harbor Plan
  - id: Y5
    match: the plan had Highly Compensated Employees for the plan year ending
  - id: Y6
    match: designed to allow participants who were age 50
  - id: Y7
    match: Based on the top heavy testing results
  - id: Y8
    match: employer match contribution is calculated on a participant's compensation
  - id: Y9
    match: not administered by Mutual of America
