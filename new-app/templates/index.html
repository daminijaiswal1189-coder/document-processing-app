<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOA Valuation Package</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1a1f2e;
      --muted: #5b6475;
      --line: #e2e8f0;
      --accent: #1d4ed8;
      --ok: #166534;
      --fail: #b91c1c;
      --warn: #92400e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main { max-width: 920px; margin: 32px auto; padding: 0 16px 48px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin: 0 0 8px; font-size: 0.9rem; }
    input[type="file"] { width: 100%; }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .file-row span { flex: 1; }
    #status { color: var(--muted); margin-top: 10px; }
    #error { color: var(--fail); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { width: 38%; color: var(--muted); font-weight: 600; }
    .pass { color: var(--ok); }
    .fail { color: var(--fail); }
    .skip { color: var(--warn); }
    a.download { display: inline-block; margin-top: 8px; font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>MOA Valuation Package</h1>
    <p class="lead">Upload source PDFs in order. The app assembles them, extracts a Plan Profile, and saves <code>{PlanNumber}_{Year}-Valuation.pdf</code>.</p>

    <section class="card">
      <label for="picker">Source PDFs</label>
      <input id="picker" type="file" accept=".pdf,application/pdf" multiple />
      <div id="file-list"></div>
      <p style="margin: 14px 0 10px;">
        <button id="run" type="button">Process package</button>
      </p>
      <div id="status"></div>
      <div id="error"></div>
    </section>

    <section id="results" class="card hidden">
      <h2 style="margin-top:0;font-size:1.1rem;">Results</h2>
      <p id="filename"></p>
      <p><a class="download" id="download" href="#">Download valuation package</a></p>
      <h3 style="font-size:1rem;">Plan Profile</h3>
      <table id="profile"></table>
      <h3 style="font-size:1rem;">Cover checks (Phase 2 starter)</h3>
      <table id="review"></table>
      <h3 style="font-size:1rem;">Rule preview (no pages removed yet)</h3>
      <table id="rules"></table>
      <h3 style="font-size:1rem;">Warnings</h3>
      <ul id="warnings"></ul>
    </section>
  </main>
  <script>
    const picker = document.getElementById("picker");
    const fileList = document.getElementById("file-list");
    const runBtn = document.getElementById("run");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const results = document.getElementById("results");
    let files = [];

    picker.addEventListener("change", () => {
      files = Array.from(picker.files || []);
      renderFiles();
    });

    function renderFiles() {
      fileList.innerHTML = "";
      files.forEach((file, index) => {
        const row = document.createElement("div");
        row.className = "file-row";
        row.innerHTML = `<span>${index + 1}. ${file.name}</span>`;
        const up = document.createElement("button");
        up.type = "button";
        up.className = "secondary";
        up.textContent = "Up";
        up.disabled = index === 0;
        up.onclick = () => { swap(index, index - 1); };
        const down = document.createElement("button");
        down.type = "button";
        down.className = "secondary";
        down.textContent = "Down";
        down.disabled = index === files.length - 1;
        down.onclick = () => { swap(index, index + 1); };
        row.append(up, down);
        fileList.appendChild(row);
      });
    }

    function swap(a, b) {
      const copy = files.slice();
      const tmp = copy[a];
      copy[a] = copy[b];
      copy[b] = tmp;
      files = copy;
      renderFiles();
    }

    runBtn.addEventListener("click", async () => {
      errorEl.textContent = "";
      if (!files.length) {
        errorEl.textContent = "Select at least one PDF.";
        return;
      }
      const form = new FormData();
      files.forEach((file) => form.append("files", file, file.name));
      runBtn.disabled = true;
      statusEl.textContent = "Processing…";
      results.classList.add("hidden");
      try {
        const response = await fetch("/api/jobs", { method: "POST", body: form });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || response.statusText);
        }
        showResults(payload);
        statusEl.textContent = "Done.";
      } catch (err) {
        errorEl.textContent = err.message || String(err);
        statusEl.textContent = "";
      } finally {
        runBtn.disabled = false;
      }
    });

    function showResults(job) {
      results.classList.remove("hidden");
      document.getElementById("filename").textContent = "Saved as " + job.filename;
      document.getElementById("download").href = job.download_url;
      fillProfile(job.plan_profile || {});
      fillReview((job.review && job.review.items) || []);
      fillRules(job.rule_decisions || []);
      const warnings = job.warnings || [];
      const list = document.getElementById("warnings");
      list.innerHTML = warnings.length
        ? warnings.map((w) => `<li>${escapeHtml(w)}</li>`).join("")
        : "<li>None</li>";
    }

    function fillProfile(profile) {
      const rows = [
        ["Plan number", profile.plan_number],
        ["Plan name", profile.plan_name],
        ["Company", profile.company_name],
        ["Address", profile.company_address],
        ["Plan year start", profile.plan_year_start],
        ["Plan year end", profile.plan_year_end],
        ["Beginning plan year", profile.beginning_plan_year],
        ["Testing method", profile.testing_method],
        ["Top heavy %", profile.top_heavy_percent],
        ["Top heavy", profile.top_heavy],
        ["ADP failed", profile.adp_failed],
        ["ACP failed", profile.acp_failed],
        ["Returns required", profile.returns_required],
        ["Total QNEC", profile.total_qnec],
        ["Pages", profile.source_page_count],
      ];
      document.getElementById("profile").innerHTML = rows.map(
        ([k, v]) => `<tr><th>${k}</th><td>${escapeHtml(fmt(v))}</td></tr>`
      ).join("");
    }

    function fillReview(items) {
      document.getElementById("review").innerHTML = items.map((item) => {
        const cls = item.passed ? "pass" : "fail";
        const mark = item.passed ? "PASS" : "FAIL";
        return `<tr><th>${escapeHtml(item.label)}</th><td class="${cls}">${mark} — ${escapeHtml(item.detail)}</td></tr>`;
      }).join("");
    }

    function fillRules(decisions) {
      document.getElementById("rules").innerHTML = decisions.map((d) => {
        const cls = d.skipped ? "skip" : (d.action === "keep" ? "pass" : "fail");
        return `<tr><th>Rule ${escapeHtml(d.rule_id)} — ${escapeHtml(d.section)}</th><td class="${cls}">${escapeHtml(d.action)} — ${escapeHtml(d.reason)}</td></tr>`;
      }).join("");
    }

    function fmt(value) {
      if (value === null || value === undefined || value === "") return "—";
      return String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }
  </script>
</body>
</html>
